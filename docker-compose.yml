services:

  # ── Postgres ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    networks:
      - pbm-net
    environment:
      POSTGRES_DB: pbm_adjudication
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Temporal Server ───────────────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.29.4
    networks:
      - pbm-net
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/dynamic-config.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./temporal-dynamic-config.yaml:/etc/temporal/dynamic-config.yaml
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Temporal UI ───────────────────────────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:2.48.1
    networks:
      - pbm-net
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:5002
    ports:
      - "8233:8080"
    depends_on:
      - temporal

  # ── Network Proxy ─────────────────────────────────────────────────────────
  # Transparent HTTP reverse proxy between the worker and the API.
  # Workers send requests to proxy:5003 instead of api:5002.
  # The Network Console tab controls fault injection via the control API on
  # port 5001, proxied through the ASP.NET API at /api/proxy/*.
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    networks:
      - pbm-net
    depends_on:
      api:
        condition: service_started

  # ── PBM Api ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    networks:
      - pbm-net
    ports:
      - "5002:5002"
    environment:
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=pbm_adjudication;Username=postgres;Password=postgres
      - Temporal__Host=temporal:7233
      - Temporal__EnableEncryption=false
      - Temporal__EnableClaimCheck=false
      - Temporal__ClaimCheckStorePath=/tmp/claim-check
      - Temporal__EncryptionKeyBase64=${TEMPORAL_ENCRYPTION_KEY}
      - BaseUrl=http://localhost:5002
      - NetworkProxy__ControlUrl=http://proxy:5001
    volumes:
      - claim-check-data:/tmp/claim-check
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

  # ── PBM Worker v1 (original single-track adjudication) ───────────────────
  # versioning-init promotes this as current automatically on startup.
  # To demo the upgrade: promote v2 manually once Linda Martinez is parked:
  #   temporal worker deployment set-current-version \
  #     --deployment-name pbm-adjudication --build-id 2.0 --yes
  worker-v1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    networks:
      - pbm-net
    environment:
      - Temporal__Host=temporal:7233
      - Temporal__EnableEncryption=false
      - Temporal__EnableClaimCheck=false
      - Temporal__ClaimCheckStorePath=/tmp/claim-check
      - Temporal__EncryptionKeyBase64=${TEMPORAL_ENCRYPTION_KEY}
      - BaseUrl=http://proxy:5003
      - ApiUrl=http://api:5002
      - USE_VERSIONING=true
      - BUILD_ID=1.0
      - DEPLOYMENT_NAME=pbm-adjudication
      - USE_GLP1_SPLIT=false
    volumes:
      - claim-check-data:/tmp/claim-check
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      api:
        condition: service_started
      proxy:
        condition: service_started

  # ── PBM Worker v2 (GLP-1 split with child workflows) ─────────────────────
  # Runs alongside v1 from the start. New claims route here once promoted.
  worker-v2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    networks:
      - pbm-net
    environment:
      - Temporal__Host=temporal:7233
      - Temporal__EnableEncryption=false
      - Temporal__EnableClaimCheck=false
      - Temporal__ClaimCheckStorePath=/tmp/claim-check
      - Temporal__EncryptionKeyBase64=${TEMPORAL_ENCRYPTION_KEY}
      - BaseUrl=http://proxy:5003
      - ApiUrl=http://api:5002
      - USE_VERSIONING=true
      - BUILD_ID=2.0
      - DEPLOYMENT_NAME=pbm-adjudication
      - USE_GLP1_SPLIT=true
    volumes:
      - claim-check-data:/tmp/claim-check
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      api:
        condition: service_started
      proxy:
        condition: service_started

  # ── Versioning Init ───────────────────────────────────────────────────────
  # Waits for both workers to register with Temporal, then promotes v1 as
  # current so new claims start on the v1 track by default.
  versioning-init:
    image: temporalio/admin-tools:1.29.4
    networks:
      - pbm-net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[versioning-init] Waiting for workers to register deployment..."
        until temporal worker deployment describe \
          --name pbm-adjudication \
          --address temporal:7233 2>/dev/null | grep -q '1.0'; do
          echo "[versioning-init] Not ready yet, retrying in 5s..."
          sleep 5
        done
        echo "[versioning-init] Workers registered. Promoting v1 as current version..."
        temporal worker deployment set-current-version \
          --deployment-name pbm-adjudication \
          --build-id 1.0 \
          --yes \
          --address temporal:7233
        echo "[versioning-init] Done. pbm-adjudication/1.0 is now current."
    depends_on:
      temporal:
        condition: service_healthy
      worker-v1:
        condition: service_started
      worker-v2:
        condition: service_started
    restart: "no"

networks:
  pbm-net:
    driver: bridge

volumes:
  postgres-data:
  claim-check-data:
