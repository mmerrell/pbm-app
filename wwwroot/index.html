<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Border Payment Orchestration</title>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@7.0.14/dist/browser/signalr.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ─── Temporal Brand Tokens ─────────────────────────────── */
        :root {
            --uv:          #444CE7;
            --uv-dim:      #3340C0;
            --uv-glow:     rgba(68, 76, 231, 0.25);
            --uv-subtle:   rgba(68, 76, 231, 0.10);
            --space:       #141414;
            --space-1:     #1c1c1c;
            --space-2:     #242424;
            --space-3:     #2e2e2e;
            --space-4:     #3a3a3a;
            --off-white:   #F8FAFC;
            --muted:       #8a8a9a;
            --border:      rgba(255,255,255,0.08);
            --border-uv:   rgba(68, 76, 231, 0.35);

            --green:       #22c55e;
            --green-bg:    rgba(34, 197, 94, 0.12);
            --red:         #ef4444;
            --red-bg:      rgba(239, 68, 68, 0.12);
            --amber:       #f59e0b;
            --amber-bg:    rgba(245, 158, 11, 0.12);
            --cyan:        #06b6d4;
            --cyan-bg:     rgba(6, 182, 212, 0.12);

            /* EDD specialty track color — teal, distinct from amber compliance review */
            --teal:        #14b8a6;
            --teal-bg:     rgba(20, 184, 166, 0.12);
            --teal-border: rgba(20, 184, 166, 0.30);

            --radius-sm:   4px;
            --radius:      8px;
            --radius-lg:   12px;

            --font-sans:   'Inter', system-ui, sans-serif;
            --font-mono:   'IBM Plex Mono', 'Consolas', monospace;
        }

        /* ─── Reset & Base ──────────────────────────────────────── */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--space);
            color: var(--off-white);
            height: 100vh;
            overflow: hidden;
        }

        /* ─── Layout ────────────────────────────────────────────── */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            padding: 12px;
            height: 100vh;
        }

        /* ─── Panel ─────────────────────────────────────────────── */
        .panel {
            background: var(--space-1);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            background: var(--space-2);
            border-bottom: 1px solid var(--border);
            color: var(--off-white);
            padding: 16px 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header .header-icon {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .panel-header .header-icon svg {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 80px;
            scrollbar-width: thin;
            scrollbar-color: var(--space-4) transparent;
        }

        .panel-content::-webkit-scrollbar { width: 4px; }
        .panel-content::-webkit-scrollbar-track { background: transparent; }
        .panel-content::-webkit-scrollbar-thumb { background: var(--space-4); border-radius: 2px; }

        /* ─── Prescription Card ─────────────────────────────────── */
        .prescription-card {
            background: var(--space-2);
            border: 1px solid var(--border);
            border-left: 3px solid var(--uv);
            padding: 14px;
            margin-bottom: 10px;
            border-radius: var(--radius);
            position: relative;
            transition: border-color 0.2s;
        }

        .prescription-card:hover { border-color: var(--border-uv); }

        .prescription-card.status-completed {
            border-left-color: var(--green);
            background: linear-gradient(135deg, var(--space-2) 0%, rgba(34, 197, 94, 0.04) 100%);
        }

        .prescription-card.status-denied {
            border-left-color: var(--red);
            background: linear-gradient(135deg, var(--space-2) 0%, rgba(239, 68, 68, 0.04) 100%);
        }

        .prescription-card.status-failed {
            border-left-color: var(--amber);
            background: linear-gradient(135deg, var(--space-2) 0%, rgba(245, 158, 11, 0.04) 100%);
        }

        /* EDD cards get a teal left border while in the specialty track */
        .prescription-card.status-edd {
            border-left-color: var(--teal);
            background: linear-gradient(135deg, var(--space-2) 0%, rgba(20, 184, 166, 0.04) 100%);
        }

        .prescription-card h3 {
            margin-bottom: 4px;
            color: var(--off-white);
            font-size: 14px;
            font-weight: 600;
            padding-right: 80px;
        }

        .prescription-card .medication {
            font-size: 13px;
            font-weight: 600;
            color: var(--uv);
            margin-bottom: 10px;
            font-family: var(--font-mono);
        }

        .recipient-row {
            font-size: 12px;
            color: var(--off-white);
            margin-bottom: 6px;
            font-family: var(--font-mono);
        }
        .recipient-row .amount { color: var(--green); font-weight: 600; }

        .prescription-card.status-edd .medication { color: var(--teal); }

        /* EDD badge on medication line */
        .edd-badge {
            display: inline-block;
            background: var(--teal-bg);
            color: var(--teal);
            border: 1px solid var(--teal-border);
            border-radius: var(--radius-sm);
            padding: 1px 6px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-left: 6px;
            vertical-align: middle;
            font-family: var(--font-mono);
        }

        .prescription-card .copay-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--green-bg);
            color: var(--green);
            border: 1px solid rgba(34, 197, 94, 0.25);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13px;
            font-family: var(--font-mono);
        }

        .prescription-card .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .prescription-card .detail,
        .prescription-card .detail-right {
            color: var(--muted);
            font-size: 11px;
            font-family: var(--font-mono);
        }

        .prescription-card .detail-right { text-align: right; }

        /* ─── Timeline ──────────────────────────────────────────── */
        .timeline {
            display: flex;
            align-items: center;
            margin-top: 14px;
            position: relative;
            padding-top: 5px;
        }

        .timeline-line {
            position: absolute;
            top: 13px;
            left: 8px;
            right: 8px;
            height: 1px;
            background: var(--space-4);
            z-index: 1;
        }

        .timeline-steps {
            display: flex;
            justify-content: space-between;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        .timeline-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .timeline-pip {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--space-3);
            border: 1px solid var(--space-4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--muted);
        }

        .timeline-pip.completed  { background: var(--green-bg); border-color: var(--green); color: var(--green); }
        .timeline-pip.current    { width: 20px; height: 20px; background: var(--uv-subtle); border-color: var(--uv); border-width: 2px; color: var(--uv); animation: pulse 2s infinite; }
        .timeline-pip.failed     { background: var(--red-bg);   border-color: var(--red);   color: var(--red); }
        .timeline-pip.infra-failed { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
        .timeline-pip.waiting    { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
        .timeline-pip.skipped    { background: var(--space-3);  border-color: var(--space-4); color: var(--space-4); font-size: 8px; }
        .timeline-pip.retrying   { background: var(--cyan-bg);  border-color: var(--cyan); color: var(--cyan); animation: pulse 1s infinite; }
        /* Teal pip for EDD review waiting state */
        .timeline-pip.specialty  { background: var(--teal-bg);  border-color: var(--teal); color: var(--teal); animation: pulse-teal 2s infinite; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 var(--uv-glow); }
            50%       { transform: scale(1.1); box-shadow: 0 0 0 4px transparent; }
        }

        @keyframes pulse-teal {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.35); }
            50%       { transform: scale(1.1); box-shadow: 0 0 0 4px transparent; }
        }

        .timeline-label {
            position: absolute;
            top: -22px;
            font-size: 9px;
            font-weight: 600;
            color: var(--space);
            white-space: nowrap;
            background: var(--amber);
            padding: 2px 6px;
            border-radius: 10px;
            font-family: var(--font-mono);
            letter-spacing: 0.02em;
        }

        .timeline-label.teal {
            background: var(--teal);
            color: #fff;
        }

        .timeline-tooltip {
            position: absolute;
            bottom: 25px;
            background: var(--space-3);
            border: 1px solid var(--border);
            color: var(--off-white);
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            font-size: 10px;
            white-space: nowrap;
            display: none;
            z-index: 100;
            left: 50%;
            transform: translateX(-50%);
            min-width: 120px;
            text-align: center;
            font-family: var(--font-mono);
        }

        .timeline-step:first-child .timeline-tooltip { left: 0; transform: none; }
        .timeline-step:last-child  .timeline-tooltip { left: auto; right: 0; transform: none; }
        .timeline-step:hover .timeline-tooltip { display: block; }

        /* ─── Doctor Portal Cards ───────────────────────────────── */
        .approval-card {
            background: var(--space-2);
            border: 1px solid var(--amber-bg);
            border-left: 3px solid var(--amber);
            padding: 14px;
            margin-bottom: 10px;
            border-radius: var(--radius);
        }

        .approval-card h3 { margin-bottom: 4px; color: var(--off-white); font-size: 14px; font-weight: 600; }

        .approval-card .medication {
            font-size: 13px; font-weight: 600; color: var(--amber);
            margin-bottom: 6px; font-family: var(--font-mono);
        }

        .approval-card .timestamp { font-size: 11px; color: var(--muted); margin-bottom: 8px; font-family: var(--font-mono); }

        /* Specialty prior auth card — teal, visually distinct from amber doctor card */
        .specialty-card {
            background: var(--space-2);
            border: 1px solid var(--teal-border);
            border-left: 3px solid var(--teal);
            padding: 14px;
            margin-bottom: 10px;
            border-radius: var(--radius);
        }

        .specialty-card h3 { margin-bottom: 4px; color: var(--off-white); font-size: 14px; font-weight: 600; }

        .specialty-card .medication {
            font-size: 13px; font-weight: 600; color: var(--teal);
            margin-bottom: 4px; font-family: var(--font-mono);
        }

        .specialty-card .specialty-label {
            font-size: 10px; font-weight: 700; color: var(--teal);
            text-transform: uppercase; letter-spacing: 0.08em;
            background: var(--teal-bg); border: 1px solid var(--teal-border);
            display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm);
            margin-bottom: 8px; font-family: var(--font-mono);
        }

        .specialty-card .timestamp { font-size: 11px; color: var(--muted); margin-bottom: 8px; font-family: var(--font-mono); }

        .specialty-card .regulatory-note {
            font-size: 10px; color: var(--muted); font-family: var(--font-mono);
            background: var(--space-3); border: 1px solid var(--border);
            padding: 6px 8px; border-radius: var(--radius-sm); margin-bottom: 10px;
            line-height: 1.5;
        }

        .approval-buttons { display: flex; gap: 8px; }

        /* ─── Buttons ────────────────────────────────────────────── */
        .btn {
            padding: 7px 14px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            font-family: var(--font-sans);
            transition: all 0.15s;
            letter-spacing: 0.02em;
        }

        .btn-approve { background: var(--green-bg); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.3); flex: 1; }
        .btn-approve:hover { background: rgba(34, 197, 94, 0.2); border-color: var(--green); }

        .btn-deny { background: var(--red-bg); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); flex: 1; }
        .btn-deny:hover { background: rgba(239, 68, 68, 0.2); border-color: var(--red); }

        .btn-new-request { background: var(--uv); color: white; border: none; padding: 6px 14px; font-size: 12px; font-weight: 600; border-radius: var(--radius-sm); }
        .btn-new-request:hover { background: var(--uv-dim); }

        /* ─── Empty State ────────────────────────────────────────── */
        .empty-state { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 13px; font-family: var(--font-mono); }

        /* ─── Divider between approval sections ─────────────────── */
        .portal-section-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.10em;
            color: var(--muted);
            padding: 4px 0 8px;
            margin-bottom: 4px;
            border-bottom: 1px solid var(--border);
            margin-top: 6px;
            font-family: var(--font-mono);
        }

        .portal-section-label:first-child { margin-top: 0; }

        /* ─── Modal ─────────────────────────────────────────────── */
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
        .modal.show { display: flex; }

        .modal-content { background: var(--space-2); border: 1px solid var(--border); padding: 28px; border-radius: var(--radius-lg); max-width: 480px; width: 90%; box-shadow: 0 24px 48px rgba(0,0,0,0.5); }
        .modal-header { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: var(--off-white); }

        .form-group { margin-bottom: 14px; }

        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }

        .form-group input,
        .form-group select { width: 100%; padding: 9px 12px; background: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--off-white); font-size: 13px; font-family: var(--font-sans); transition: border-color 0.15s; }

        .form-group input:focus,
        .form-group select:focus { outline: none; border-color: var(--uv); box-shadow: 0 0 0 3px var(--uv-glow); }

        .form-group select option { background: var(--space-3); }

        /* High-risk / EDD checkbox row in modal */
        .edd-checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--space-3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .edd-checkbox-row:has(input:checked) {
            border-color: var(--teal);
            background: var(--teal-bg);
        }

        .edd-checkbox-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--teal);
            cursor: pointer;
            flex-shrink: 0;
        }

        .edd-checkbox-label {
            font-size: 12px;
            color: var(--off-white);
            font-weight: 500;
            line-height: 1.4;
        }

        .edd-checkbox-label span {
            display: block;
            font-size: 10px;
            color: var(--muted);
            font-family: var(--font-mono);
            margin-top: 2px;
        }

        /* ─── File Upload ────────────────────────────────────────── */
        .file-upload-area { border: 1px dashed var(--border); border-radius: var(--radius-sm); background: var(--space-3); padding: 12px; cursor: pointer; transition: border-color 0.15s, background 0.15s; position: relative; }
        .file-upload-area:hover, .file-upload-area.has-file { border-color: var(--uv); background: var(--uv-subtle); }
        .file-upload-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; padding: 0; border: none; background: transparent; }
        .file-upload-label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-family: var(--font-mono); pointer-events: none; }
        .file-upload-label .file-icon { font-size: 16px; line-height: 1; }
        .file-upload-label.file-selected { color: var(--uv); }
        .file-size-warning { margin-top: 6px; font-size: 10px; font-family: var(--font-mono); display: none; }
        .file-size-warning.show { display: block; }
        .file-size-warning.over-threshold { color: var(--amber); }
        .file-size-warning.under-threshold { color: var(--muted); }

        /* ─── Modal Buttons ──────────────────────────────────────── */
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn-submit { flex: 1; background: var(--uv); color: white; padding: 10px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-weight: 600; font-family: var(--font-sans); }
        .btn-submit:hover { background: var(--uv-dim); }
        .btn-cancel { flex: 1; background: var(--space-3); color: var(--muted); padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); cursor: pointer; font-weight: 600; font-family: var(--font-sans); }
        .btn-cancel:hover { color: var(--off-white); border-color: var(--space-4); }

        /* ─── Confirm Modal ──────────────────────────────────────── */
        .confirm-modal { display: none; position: fixed; z-index: 2000; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
        .confirm-modal.show { display: flex; }
        .confirm-content { background: var(--space-2); border: 1px solid var(--border); padding: 28px; border-radius: var(--radius-lg); max-width: 380px; width: 90%; box-shadow: 0 24px 48px rgba(0,0,0,0.5); text-align: center; }
        .confirm-message { font-size: 14px; color: var(--off-white); margin-bottom: 20px; line-height: 1.5; }
        .confirm-buttons { display: flex; gap: 10px; }
        .btn-confirm-yes { flex: 1; background: var(--red-bg); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-family: var(--font-sans); font-size: 13px; }
        .btn-confirm-yes:hover { background: rgba(239, 68, 68, 0.2); border-color: var(--red); }
        .btn-confirm-no { flex: 1; background: var(--space-3); color: var(--muted); border: 1px solid var(--border); padding: 10px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-family: var(--font-sans); font-size: 13px; }
        .btn-confirm-no:hover { color: var(--off-white); }

        /* ─── Control Panel ──────────────────────────────────────── */
        .admin-section { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
        .admin-buttons { display: flex; gap: 8px; }
        .btn-admin { flex: 1; padding: 9px; background: var(--uv); color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 12px; font-family: var(--font-sans); letter-spacing: 0.02em; transition: background 0.15s; }
        .btn-admin:hover { background: var(--uv-dim); }
        .btn-reset { background: var(--red-bg); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-reset:hover { background: rgba(239, 68, 68, 0.2); }

        /* ─── Endpoint Config ────────────────────────────────────── */
        .endpoint-config { background: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; }
        .endpoint-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .endpoint-config h3 { color: var(--off-white); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin: 0; }
        .control-group { margin-bottom: 6px; }
        .control-label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
        .slider-container { display: flex; align-items: center; gap: 8px; }

        input[type="range"] { flex: 1; height: 3px; border-radius: 2px; background: var(--space-4); outline: none; -webkit-appearance: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--uv); cursor: pointer; border: 2px solid var(--space-1); box-shadow: 0 0 0 1px var(--uv); transition: transform 0.15s; }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        .slider-value { min-width: 48px; text-align: right; font-weight: 600; color: var(--uv); font-size: 11px; font-family: var(--font-mono); }

        /* ─── Toggle Switch ──────────────────────────────────────── */
        .toggle-switch { position: relative; width: 40px; height: 20px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: var(--green); transition: .25s; border-radius: 20px; }
        .toggle-slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: white; transition: .25s; border-radius: 50%; }
        input:checked + .toggle-slider { background: var(--red); }
        input:checked + .toggle-slider:before { transform: translateX(20px); }
        .feature-flag-toggle .toggle-slider { background: var(--red); }
        .feature-flag-toggle input:checked + .toggle-slider { background: var(--green); }

        /* ─── Logs ───────────────────────────────────────────────── */
        .logs-section { margin-top: 14px; }
        .logs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .logs-header h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
        .btn-clear-logs { padding: 3px 10px; background: var(--space-3); color: var(--muted); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 10px; font-family: var(--font-sans); transition: color 0.15s; }
        .btn-clear-logs:hover { color: var(--off-white); }
        .logs-container { background: var(--space); border: 1px solid var(--border); color: #c4c4d4; padding: 10px 12px; border-radius: var(--radius); height: 200px; overflow-y: auto; font-family: var(--font-mono); font-size: 10.5px; line-height: 1.5; scrollbar-width: thin; scrollbar-color: var(--space-4) transparent; }
        .logs-container::-webkit-scrollbar { width: 3px; }
        .logs-container::-webkit-scrollbar-thumb { background: var(--space-4); }
        .log-entry { margin-bottom: 2px; word-wrap: break-word; color: var(--muted); }
        .log-entry::before { content: '› '; color: var(--uv); }

        /* ─── Connection Status ──────────────────────────────────── */
        .connection-status { position: fixed; top: 12px; right: 12px; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; font-family: var(--font-mono); z-index: 1000; cursor: pointer; transition: all 0.2s; user-select: none; letter-spacing: 0.04em; border: 1px solid; }
        .connection-status:hover { transform: translateY(-1px); }
        .connection-status.connected    { background: var(--green-bg); color: var(--green); border-color: rgba(34, 197, 94, 0.3); }
        .connection-status.disconnected { background: var(--red-bg);   color: var(--red);   border-color: rgba(239, 68, 68, 0.3); }
        .connection-status.auto-mode    { background: var(--uv-subtle); color: var(--uv);   border-color: var(--border-uv); }

        /* ─── Status Tooltip ─────────────────────────────────────── */
        .status-tooltip { position: fixed; background: var(--space-2); border: 1px solid var(--border); color: var(--off-white); padding: 10px 14px; border-radius: var(--radius); font-size: 11px; font-family: var(--font-mono); z-index: 1001; display: none; max-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); line-height: 1.6; }
        .status-tooltip.show { display: block; }

        /* ─── Notification badges ────────────────────────────────── */
        .notif-badge { margin-top: 8px; padding: 5px 8px; border-radius: var(--radius-sm); font-size: 10px; font-family: var(--font-mono); display: flex; align-items: center; gap: 5px; }
        .notif-badge.retrying { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.25); }
        .notif-badge.failed   { background: var(--red-bg);   color: var(--red);   border: 1px solid rgba(239, 68, 68, 0.25); }
        .notif-badge.sent     { background: var(--green-bg); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.25); }

        .workflow-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-family: var(--font-mono);
            color: var(--muted);
            text-decoration: none;
            margin-bottom: 8px;
            transition: color 0.15s;
        }

        .workflow-link:hover { color: var(--uv); }

        /* ─── Process button ─────────────────────────────────────── */
        .btn-process { width: 100%; margin-top: 8px; padding: 7px; background: var(--uv-subtle); color: var(--uv); border: 1px solid var(--border-uv); border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 11px; font-family: var(--font-sans); letter-spacing: 0.04em; transition: all 0.15s; }
        .btn-process:hover { background: var(--uv); color: white; border-color: var(--uv); }

        /* ─── Feature Flags ──────────────────────────────────────── */
        .feature-flags-section { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
        .feature-flags-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
        .feature-flag-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; }
        .feature-flag-info { display: flex; flex-direction: column; gap: 2px; }
        .feature-flag-name { font-size: 12px; font-weight: 600; color: var(--off-white); }
        .feature-flag-desc { font-size: 10px; color: var(--muted); font-family: var(--font-mono); }

        /* ─── Version Badge ──────────────────────────────────────── */
        .version-badge { position: fixed; bottom: 16px; right: 16px; background: var(--space-2); border-radius: var(--radius); padding: 10px 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; z-index: 9999; display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-weight: 600; font-size: 12px; border: 1px solid; letter-spacing: 0.06em; text-decoration: none; color: inherit; }
        .version-badge:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .version-badge img { width: 28px; height: 28px; border-radius: 4px; }
        .version-badge.temporal { border-color: var(--uv); color: var(--uv); }

        /* ─── Temporal wordmark ──────────────────────────────────── */
        .temporal-wordmark { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: var(--uv); text-transform: uppercase; }
        .temporal-wordmark::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--uv); border-radius: 2px; transform: rotate(45deg); }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus" onclick="toggleAutoProcess()" onmouseenter="showStatusTooltip(event)" onmouseleave="hideStatusTooltip()">Connecting...</div>
    <div class="status-tooltip" id="statusTooltip"></div>

    <!-- New Request Modal -->
    <div class="modal" id="newRequestModal">
        <div class="modal-content">
            <div class="modal-header">New Payment Request</div>
            <div class="form-group">
                <label for="patientName">Customer Name</label>
                <input type="text" id="patientName" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="recipientName">Recipient Name</label>
                <input type="text" id="recipientName" placeholder="Jane Doe">
            </div>
            <div class="form-group">
                <label for="amount">Amount (USD)</label>
                <input type="number" id="amount" min="1" step="0.01" value="1000">
            </div>
            <div class="form-group">
                <label for="medication">Currency Corridor</label>
                <select id="medication">
                    <option>USD → EUR</option>
                    <option>USD → GBP</option>
                    <option>USD → SGD</option>
                    <option>USD → CAD</option>
                    <option>USD → AUD</option>
                    <option>EUR → JPY</option>
                    <option>USD → HKD</option>
                    <option>USD → NZD</option>
                    <option>EUR → CHF</option>
                    <option>USD → INR</option>
                    <option>USD → BRL</option>
                </select>
            </div>
            <div class="form-group">
                <label for="eligibleDate">Funds Available Date</label>
                <input type="datetime-local" id="eligibleDate">
            </div>
            <div class="form-group">
                <label for="refills">Prior Clean Transfers</label>
                <input type="number" id="refills" min="0" max="12" value="3">
            </div>
            <!-- High-risk flag: triggers the v2 EDD split-track adjudication path -->
            <div class="form-group">
                <label>High-Risk / EDD Required</label>
                <label class="edd-checkbox-row" for="isHighRisk">
                    <input type="checkbox" id="isHighRisk">
                    <div class="edd-checkbox-label">
                        This transfer is high-risk / requires enhanced due diligence
                        <span>Large-value, new-beneficiary, or PEP-linked transfers require enhanced due diligence. Activates the EDD compliance track (v2+ workers)</span>
                    </div>
                </label>
            </div>
            <!-- Claim Check demo: attach an image to trigger large-payload path -->
            <div class="form-group">
                <label>Attach Document <span style="color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0">(proof of funds / ID verification — triggers Claim Check)</span></label>
                <div class="file-upload-area" id="fileUploadArea">
                    <input type="file" id="imageAttachment" accept="image/*" onchange="handleImageSelect(this)">
                    <div class="file-upload-label" id="fileUploadLabel">
                        <span class="file-icon">📎</span>
                        <span id="fileUploadText">Click to attach document (optional)</span>
                    </div>
                </div>
                <div class="file-size-warning" id="fileSizeWarning"></div>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-submit" onclick="submitNewRequest()">Submit &amp; Process</button>
                <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="confirm-modal" id="confirmModal" onclick="if(event.target === this) closeConfirmModal()">
        <div class="confirm-content">
            <div class="confirm-message" id="confirmMessage"></div>
            <div class="confirm-buttons">
                <button class="btn-confirm-yes" id="confirmYes">Yes, continue</button>
                <button class="btn-confirm-no" onclick="closeConfirmModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Patient Portal -->
        <div class="panel">
            <div class="panel-header">
                <span class="header-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                    Customer Portal
                </span>
                <button class="btn-new-request" onclick="openNewRequestModal()">+ New Payment</button>
            </div>
            <div class="panel-content" id="patientPortal">
                <div class="empty-state">No payments to display</div>
            </div>
        </div>

        <!-- Doctor Portal -->
        <div class="panel">
            <div class="panel-header">
                <span class="header-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
                    Compliance Portal
                </span>
            </div>
            <div class="panel-content" id="doctorPortal">
                <div class="empty-state">No review requests</div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="panel">
            <div class="panel-header">
                <span class="header-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                    Control Panel
                </span>
                <span class="temporal-wordmark">Temporal</span>
            </div>
            <div class="panel-content">
                <div class="admin-section">
                    <div class="admin-buttons">
                        <button class="btn btn-admin" onclick="generateLoad()">Generate 20 Payments</button>
                        <button class="btn btn-admin btn-reset" onclick="resetEverything()">Reset All</button>
                    </div>
                </div>

                <!-- Feature Flags -->
                <div class="feature-flags-section">
                    <div class="feature-flags-title">Feature Flags</div>
                    <div class="feature-flag-row">
                        <div class="feature-flag-info">
                            <span class="feature-flag-name">Payload Encryption</span>
                            <span class="feature-flag-desc" id="encryptionDesc">Loading...</span>
                        </div>
                        <label class="toggle-switch feature-flag-toggle">
                            <input type="checkbox" id="encryptionToggle" onchange="toggleEncryption(this.checked)">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="feature-flag-row">
                        <div class="feature-flag-info">
                            <span class="feature-flag-name">Claim Check</span>
                            <span class="feature-flag-desc" id="claimCheckDesc">Loading...</span>
                        </div>
                        <label class="toggle-switch feature-flag-toggle">
                            <input type="checkbox" id="claimCheckToggle" onchange="toggleClaimCheck(this.checked)">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>

                <div id="endpointConfigs"></div>

                <div class="logs-section">
                    <div class="logs-header">
                        <h3>System Logs</h3>
                        <button class="btn-clear-logs" onclick="clearLogs()">Clear</button>
                    </div>
                    <div class="logs-container" id="logsContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="version-badge temporal" onclick="window.open('https://github.com/mmerrell/PBMAdjudicationService/tree/temporal', '_blank')">
        <img src="https://avatars.githubusercontent.com/u/56493103?s=200&v=4" alt="Temporal">
        <span>TEMPORAL</span>
    </div>

    <script>
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/notificationHub")
            .withAutomaticReconnect()
            .build();

        let prescriptions = {};
        let approvals = {};
        let specialtyApprovals = {};
        let endpointConfigs = {};
        let autoProcessMode = false;
        let activeWorkflows = 0;
        let isConnecting = false;

        let pendingImageBase64 = null;
        const CLAIM_CHECK_THRESHOLD_KB = 128;

        // Display-only mapping from backend status enum values to friendly UI text.
        // Backend enum values are unchanged — this is purely a frontend label layer.
        const statusLabels = {
            Pending: 'Pending',
            Waiting: 'Waiting',
            Validated: 'Account Verified',
            Authorized: 'Screening Cleared',
            Adjudicated: 'FX Calculated',
            AdjudicatingEdd: 'EDD Review In Progress',
            ApprovalNeeded: 'Review Needed',
            ApprovalTimeout: 'Review Timeout',
            Approved: 'Approved',
            Denied: 'Rejected',
            Completed: 'Settled',
            OnHold: 'On Hold',
            SpecialtyAuthPending: 'EDD Pending',
            SpecialtyAuthApproved: 'EDD Approved',
            SpecialtyAuthTimeout: 'EDD Timeout',
            Submitting: 'Settling',
            SubmittingSpecialty: 'Settling (Enhanced Rail)'
        };

        async function startConnection() {
            if (isConnecting) return;
            isConnecting = true;
            try {
                await connection.start();
                updateConnectionStatus();
                await loadPrescriptions();
                await loadApprovals();
                await loadSpecialtyApprovals();
                await loadConfigs();
                await loadFeatureFlags();
            } catch (err) {
                console.error(err);
                document.getElementById('connectionStatus').textContent = 'Disconnected';
                document.getElementById('connectionStatus').className = 'connection-status disconnected';
                setTimeout(startConnection, 5000);
            } finally {
                isConnecting = false;
            }
        }

        function updateConnectionStatus() {
            const statusEl = document.getElementById('connectionStatus');
            if (autoProcessMode) {
                statusEl.textContent = '⚡ Auto-Process';
                statusEl.className = 'connection-status auto-mode';
            } else {
                statusEl.textContent = '● Manual Mode';
                statusEl.className = 'connection-status connected';
            }
        }

        async function toggleAutoProcess() {
            autoProcessMode = !autoProcessMode;
            updateConnectionStatus();
            if (autoProcessMode) {
                const toProcess = Object.values(prescriptions).filter(p => p.status === 'Pending');
                for (const p of toProcess) await processWorkflow(p.id, p.isHighRisk);
            }
        }

        function showStatusTooltip(event) {
            const tooltip = document.getElementById('statusTooltip');
            const mode = autoProcessMode ? 'Auto-Process' : 'Manual';
            const workflowText = activeWorkflows > 0 ? `${activeWorkflows} active workflow(s)` : 'No active workflows';
            tooltip.innerHTML = `<strong>Mode:</strong> ${mode}<br><strong>Status:</strong> Connected<br><strong>Workflows:</strong> ${workflowText}<br><em style="color: var(--muted)">Click to toggle mode</em>`;
            tooltip.style.top = (event.clientY + 10) + 'px';
            tooltip.style.left = (event.clientX - 100) + 'px';
            tooltip.classList.add('show');
        }

        function hideStatusTooltip() { document.getElementById('statusTooltip').classList.remove('show'); }

        connection.on("ReceiveLog", (message) => {
            const logsContainer = document.getElementById('logsContainer');
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsContainer.appendChild(logEntry);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        });

        connection.on("PrescriptionUpdated", (prescription) => {
            prescriptions[prescription.id] = prescription;
            renderPrescriptions();
        });

        connection.on("ApprovalRequestUpdated", (approval) => {
            approvals[approval.id] = approval;
            renderApprovals();
        });

        connection.on("SpecialtyApprovalRequestUpdated", (req) => {
            specialtyApprovals[req.id] = req;
            renderApprovals();
        });

        // ── Feature flags ──────────────────────────────────────────────────────

        async function loadFeatureFlags() {
            const response = await fetch('/api/config/features');
            const data = await response.json();
            const encToggle = document.getElementById('encryptionToggle');
            const encDesc   = document.getElementById('encryptionDesc');
            encToggle.checked = data.enableEncryption;
            encDesc.textContent = data.enableEncryption ? 'ON — PII encrypted in Temporal history' : 'OFF — PII visible in Temporal history';
            encDesc.style.color = data.enableEncryption ? 'var(--green)' : 'var(--muted)';
            document.getElementById('claimCheckToggle').checked = data.enableClaimCheck;
            updateClaimCheckDesc(data.enableClaimCheck);
        }

        async function toggleEncryption(enabled) {
            const current = await (await fetch('/api/config/features')).json();
            await fetch('/api/config/features', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enableEncryption: enabled, enableClaimCheck: current.enableClaimCheck }) });
            const desc = document.getElementById('encryptionDesc');
            desc.textContent = enabled ? 'ON — PII encrypted in Temporal history' : 'OFF — PII visible in Temporal history';
            desc.style.color = enabled ? 'var(--green)' : 'var(--muted)';
        }

        async function toggleClaimCheck(enabled) {
            const current = await (await fetch('/api/config/features')).json();
            await fetch('/api/config/features', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enableEncryption: current.enableEncryption, enableClaimCheck: enabled }) });
            updateClaimCheckDesc(enabled);
        }

        function updateClaimCheckDesc(enabled) {
            const desc = document.getElementById('claimCheckDesc');
            desc.textContent = enabled ? `ON — documents >${CLAIM_CHECK_THRESHOLD_KB} KB offloaded to storage` : 'OFF — large payloads sent raw to Temporal';
            desc.style.color = enabled ? 'var(--green)' : 'var(--muted)';
        }

        // ── Image attachment ───────────────────────────────────────────────────

        function handleImageSelect(input) {
            const file = input.files[0];
            const label      = document.getElementById('fileUploadLabel');
            const labelText  = document.getElementById('fileUploadText');
            const uploadArea = document.getElementById('fileUploadArea');
            const warning    = document.getElementById('fileSizeWarning');
            if (!file) {
                pendingImageBase64 = null;
                label.classList.remove('file-selected');
                uploadArea.classList.remove('has-file');
                labelText.textContent = 'Click to attach document (optional)';
                warning.classList.remove('show');
                return;
            }
            const sizeKb = Math.round(file.size / 1024);
            labelText.textContent = `${file.name} (${sizeKb} KB)`;
            label.classList.add('file-selected');
            uploadArea.classList.add('has-file');
            if (sizeKb > CLAIM_CHECK_THRESHOLD_KB) {
                warning.textContent = `⚠ ${sizeKb} KB exceeds ${CLAIM_CHECK_THRESHOLD_KB} KB threshold — Claim Check will offload this document if enabled`;
                warning.className = 'file-size-warning show over-threshold';
            } else {
                warning.textContent = `${sizeKb} KB — under ${CLAIM_CHECK_THRESHOLD_KB} KB threshold, will pass through inline`;
                warning.className = 'file-size-warning show under-threshold';
            }
            const reader = new FileReader();
            reader.onload = (e) => { pendingImageBase64 = e.target.result.split(',')[1]; };
            reader.readAsDataURL(file);
        }

        // ── Load data ──────────────────────────────────────────────────────────

        async function loadPrescriptions() {
            const response = await fetch('/api/prescriptions');
            const data = await response.json();
            prescriptions = {};
            data.forEach(p => prescriptions[p.id] = p);
            renderPrescriptions();
        }

        async function loadApprovals() {
            const response = await fetch('/api/approvals');
            const data = await response.json();
            approvals = {};
            data.forEach(a => approvals[a.id] = a);
            renderApprovals();
        }

        async function loadSpecialtyApprovals() {
            const response = await fetch('/api/specialty-approvals');
            const data = await response.json();
            specialtyApprovals = {};
            data.forEach(a => specialtyApprovals[a.id] = a);
            renderApprovals();
        }

        async function loadConfigs() {
            const response = await fetch('/api/config');
            endpointConfigs = await response.json();
            renderConfigs();
        }

        // ── Render prescriptions ───────────────────────────────────────────────

        function renderPrescriptions() {
            const container = document.getElementById('patientPortal');
            const prescriptionList = Object.values(prescriptions).sort((a, b) =>
                new Date(b.requestedDate) - new Date(a.requestedDate));

            if (prescriptionList.length === 0) {
                container.innerHTML = '<div class="empty-state">No payments to display</div>';
                return;
            }

            function generateTimeline(p) {
                const steps = [
                    { key: 'validate',   name: 'Verify'   },
                    { key: 'authorize',  name: 'Screen'   },
                    { key: 'adjudicate', name: 'Calculate' },
                    { key: 'approval',   name: 'Review'   },
                    { key: 'submit',     name: 'Settle'   }
                ];

                const eddStatuses = ['AdjudicatingEdd', 'SpecialtyAuthPending', 'SpecialtyAuthApproved', 'SpecialtyAuthTimeout', 'SubmittingSpecialty'];
                // isEddFlow: true whenever we're in an EDD-specific status, OR
                // it's a high-risk transfer that completed/was denied without going
                // through the standard compliance review path (no approvalNeededReason).
                const isEddFlow = eddStatuses.includes(p.status)
                    || (p.isHighRisk
                        && (p.status === 'Completed' || p.status === 'Denied')
                        && !p.approvalNeededReason);

                let currentStepIndex = -1, failedStep = -1;
                let isWaiting = p.status === 'Waiting', approvalSkipped = false;

                if      (p.status === 'Pending')                                             { currentStepIndex = -1; }
                else if (p.status === 'Waiting')                                             { currentStepIndex = 0; }
                else if (p.status === 'Validating'   || p.status === 'Validated')           { currentStepIndex = 0; }
                else if (p.status === 'Authorizing'  || p.status === 'Authorized')          { currentStepIndex = 1; }
                else if (p.status === 'Adjudicating' || p.status === 'Adjudicated' ||
                         p.status === 'AdjudicatingEdd')                                    { currentStepIndex = 2; }
                else if (p.status === 'SpecialtyAuthPending')                               { currentStepIndex = 3; }
                else if (p.status === 'SpecialtyAuthApproved')                              { currentStepIndex = 3; }
                else if (p.status === 'SpecialtyAuthTimeout')                               { currentStepIndex = 3; failedStep = 3; }
                else if (p.status === 'ApprovalNeeded' || p.status === 'Approved' ||
                         p.status === 'Denied' || p.status === 'ApprovalTimeout')           {
                    currentStepIndex = 3;
                    if (p.status === 'Denied' || p.status === 'ApprovalTimeout') failedStep = 3;
                }
                else if (p.status === 'Submitting' || p.status === 'SubmittingSpecialty' || p.status === 'Completed') {
                    currentStepIndex = 4;
                    // For the EDD v2 path there's no standard compliance review step — mark it skipped.
                    // For standard path, skip review only if it wasn't needed (no approvalNeededReason).
                    if (isEddFlow || (!p.approvalNeededReason && !isEddFlow)) approvalSkipped = true;
                }
                else if (p.status === 'OnHold') {
                    currentStepIndex = p.failedStep ?? -1;
                    failedStep       = p.failedStep ?? -1;
                }

                let html = '<div class="timeline"><div class="timeline-line"></div><div class="timeline-steps">';

                steps.forEach((step, index) => {
                    let pipClass = 'timeline-pip', icon = '', label = '', tooltip = step.name;

                    if (index === failedStep) {
                        pipClass += ' failed'; icon = '✗';
                        if (p.status === 'ApprovalTimeout') {
                            label   = `<div class="timeline-label">Review Timeout</div>`;
                            tooltip = `${step.name} - Timed out`;
                        } else if (p.status === 'SpecialtyAuthTimeout') {
                            label   = `<div class="timeline-label">EDD Timeout</div>`;
                            tooltip = `${step.name} - Timed out`;
                        } else {
                            label   = `<div class="timeline-label">Rejected</div>`;
                            tooltip = `${step.name} - Rejected`;
                        }
                    } else if (approvalSkipped && index === 3) {
                        pipClass += ' skipped'; icon = '⊘'; tooltip = `${step.name} - Not required`;
                    } else if (index < currentStepIndex ||
                               (index === currentStepIndex &&
                                (p.status === 'Adjudicated' || p.status === 'Authorized' ||
                                 p.status === 'Validated' || p.status === 'Approved' ||
                                 p.status === 'SpecialtyAuthApproved' || p.status === 'Completed') &&
                                !(approvalSkipped && index === 3) && failedStep !== index)) {
                        pipClass += ' completed'; icon = '✓'; tooltip = `${step.name} - Completed`;
                    } else if (index === currentStepIndex) {
                        if (isWaiting && index === 0) {
                            pipClass += ' waiting'; icon = '⏰';
                            label = `<div class="timeline-label">Account Not Verified Yet</div>`;
                            tooltip = `${step.name} - Waiting`;
                        } else if (p.status === 'SpecialtyAuthPending' && index === 3) {
                            pipClass += ' specialty'; icon = '🔬';
                            label = `<div class="timeline-label teal">EDD Review</div>`;
                            tooltip = `${step.name} - Awaiting compliance reviewer`;
                        } else if (p.status === 'ApprovalNeeded' && index === 3) {
                            pipClass += ' waiting'; icon = '⏰';
                            label = `<div class="timeline-label">Awaiting Compliance</div>`;
                            tooltip = `${step.name} - Pending approval`;
                        } else if (failedStep === index) {
                            pipClass += ' failed'; icon = '✗';
                            label = `<div class="timeline-label">Rejected</div>`; tooltip = `${step.name} - Rejected`;
                        } else {
                            pipClass += ' current';
                            label = `<div class="timeline-label">${statusLabels[p.status] || p.status}</div>`; tooltip = `${step.name} - In Progress`;
                        }
                    }

                    html += `<div class="timeline-step">${label}<div class="${pipClass}">${icon}</div><div class="timeline-tooltip">${tooltip}</div></div>`;
                });

                return html + '</div></div>';
            }

            container.innerHTML = prescriptionList.map(p => {
                const isHighRiskCard = ['AdjudicatingEdd','SpecialtyAuthPending','SpecialtyAuthApproved','SpecialtyAuthTimeout'].includes(p.status)
                    || p.isHighRisk;

                const eligibleDate = new Date(p.eligibleDate);
                const eligibleText = new Date() >= eligibleDate
                    ? `<span style="color: var(--green);">✓ Verified</span>`
                    : `<span style="color: var(--amber);">⏰ ${eligibleDate.toLocaleDateString()} ${eligibleDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>`;

                let notifBadge = '';
                if      (p.notificationStatus === 'Retrying') notifBadge = `<div class="notif-badge retrying">⚠ Notification retrying...</div>`;
                else if (p.notificationStatus === 'Failed')   notifBadge = `<div class="notif-badge failed">✗ Notification failed permanently</div>`;
                else if (p.notificationStatus === 'Sent')     notifBadge = `<div class="notif-badge sent">✓ Customer notified</div>`;

                const cardClass = p.status === 'Completed' ? 'status-completed'
                    : (p.status === 'Denied' || p.status === 'ApprovalTimeout' || p.status === 'SpecialtyAuthTimeout') ? 'status-denied'
                    : p.status === 'OnHold' ? 'status-failed'
                    : isHighRiskCard ? 'status-edd'
                    : '';

                const riskBadge = isHighRiskCard ? `<span class="edd-badge">High-Risk</span>` : '';

                const workflowId = `payment-${p.patientId}-${p.id}`;
                const workflowUrl = `http://localhost:8233/namespaces/default/workflows/${workflowId}`;
                const workflowLink = p.status !== 'Pending'
                    ? `<a class="workflow-link" href="${workflowUrl}" target="_blank">⬡ ${workflowId}</a>`
                    : '';

                return `
                    <div class="prescription-card ${cardClass}">
                        ${p.copay ? `<div class="copay-badge">${p.copay.toFixed(2)}</div>` : ''}
                        <h3>${p.patientName}</h3>
                        <div class="recipient-row">→ ${p.recipientName} &middot; <span class="amount">$${Number(p.amount).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span></div>
                        <div class="medication">${p.medication}${riskBadge}</div>
                        ${workflowLink}
                        <div class="info-row">
                            <div class="detail">ID: ${p.patientId}</div>
                            <div class="detail-right">${eligibleText}</div>
                        </div>
                        <div class="info-row">
                            <div class="detail">Prior Transfers: ${p.refillsRemaining}</div>
                            <div class="detail-right">${new Date(p.requestedDate).toLocaleDateString()} ${new Date(p.requestedDate).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                        </div>
                        ${generateTimeline(p)}
                        ${p.status === 'Pending' ? `<button class="btn-process" onclick="processWorkflow('${p.id}', ${p.isHighRisk})">▶ Process Workflow</button>` : ''}
                        ${notifBadge}
                    </div>`;
            }).join('');
        }

        // ── Render approvals ───────────────────────────────────────────────────

        function renderApprovals() {
            const container = document.getElementById('doctorPortal');

            const doctorList = Object.values(approvals)
                .filter(a => !a.isApproved && !a.isDenied)
                .sort((a, b) => new Date(b.requestedAt) - new Date(a.requestedAt));

            const specialtyList = Object.values(specialtyApprovals)
                .filter(a => !a.isApproved && !a.isDenied && !a.isTimedOut)
                .sort((a, b) => new Date(b.requestedAt) - new Date(a.requestedAt));

            if (doctorList.length === 0 && specialtyList.length === 0) {
                container.innerHTML = '<div class="empty-state">No approval requests</div>';
                return;
            }

            let html = '';

            // Specialty prior auth cards — teal, shown first (higher regulatory urgency)
            if (specialtyList.length > 0) {
                html += `<div class="portal-section-label">🔍 Enhanced Due Diligence (EDD) Review</div>`;
                html += specialtyList.map(a => `
                    <div class="specialty-card">
                        <h3>${a.patientName}</h3>
                        <div class="recipient-row">→ ${a.recipientName} &middot; <span class="amount">$${Number(a.amount).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span></div>
                        <div class="medication">${a.medication}</div>
                        <div class="specialty-label">EDD Required</div>
                        <div class="regulatory-note">
                            Regulatory mandate: all high-risk transfers require enhanced due diligence review.<br>
                            This review is separate from the standard compliance track.
                        </div>
                        <div class="timestamp">Requested: ${new Date(a.requestedAt).toLocaleString()}</div>
                        <div class="approval-buttons">
                            <button class="btn btn-approve" onclick="handleSpecialtyApproval('${a.id}', true)">✓ Clear</button>
                            <button class="btn btn-deny"    onclick="handleSpecialtyApproval('${a.id}', false)">✗ Reject</button>
                        </div>
                    </div>`).join('');
            }

            // Standard doctor approval cards — amber
            if (doctorList.length > 0) {
                html += `<div class="portal-section-label">📋 Compliance Review</div>`;
                html += doctorList.map(a => `
                    <div class="approval-card">
                        <h3>${a.patientName}</h3>
                        <div class="recipient-row">→ ${a.recipientName} &middot; <span class="amount">$${Number(a.amount).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span></div>
                        <div class="medication">${a.medication}</div>
                        <div class="timestamp">Requested: ${new Date(a.requestedAt).toLocaleString()}</div>
                        ${a.reminderCount > 0 ? `<div class="timestamp">Reminders sent: ${a.reminderCount}</div>` : ''}
                        <div class="approval-buttons">
                            <button class="btn btn-approve" onclick="handleApproval('${a.id}', true)">✓ Approve</button>
                            <button class="btn btn-deny"    onclick="handleApproval('${a.id}', false)">✗ Reject</button>
                        </div>
                    </div>`).join('');
            }

            container.innerHTML = html;
        }

        // ── Render endpoint configs ────────────────────────────────────────────

        function renderConfigs() {
            const container = document.getElementById('endpointConfigs');
            const endpoints = [
                { key: 'validate',        name: 'Verify Account (KYB)'      },
                { key: 'authorize',       name: 'AML/Sanctions Screening'        },
                { key: 'adjudicate',      name: 'FX & Fee Calculation'           },
                { key: 'adjudicate-edd', name: 'EDD Review (High-Risk)' },
                { key: 'notify',          name: 'Notifications'              },
                { key: 'submit',          name: 'Settle Payment'         },
                { key: 'submit-specialty',name: 'Settle via Enhanced Rail' }
            ];

            container.innerHTML = endpoints.map(ep => {
                const config = endpointConfigs[ep.key] || { failureRatePercent: 0, latencyMs: 0, completeOutage: false };
                return `
                    <div class="endpoint-config">
                        <div class="endpoint-header">
                            <h3>${ep.name}</h3>
                            <label class="toggle-switch">
                                <input type="checkbox" id="${ep.key}-outage" ${config.completeOutage ? 'checked' : ''}
                                    onchange="updateConfig('${ep.key}', 'completeOutage', this.checked)">
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div class="control-group">
                            <label class="control-label">Failure Rate</label>
                            <div class="slider-container">
                                <input type="range" min="0" max="100" value="${config.failureRatePercent}"
                                    oninput="updateConfig('${ep.key}', 'failureRatePercent', this.value)">
                                <span class="slider-value" id="${ep.key}-failure">${config.failureRatePercent}%</span>
                            </div>
                        </div>
                        <div class="control-group">
                            <label class="control-label">Latency (ms)</label>
                            <div class="slider-container">
                                <input type="range" min="0" max="5000" step="100" value="${config.latencyMs}"
                                    oninput="updateConfig('${ep.key}', 'latencyMs', this.value)">
                                <span class="slider-value" id="${ep.key}-latency">${config.latencyMs}ms</span>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        async function updateConfig(endpoint, property, value) {
            const config = endpointConfigs[endpoint];
            if (property === 'completeOutage') config[property] = value;
            else config[property] = parseInt(value);
            if (property === 'failureRatePercent') document.getElementById(`${endpoint}-failure`).textContent = `${value}%`;
            else if (property === 'latencyMs')     document.getElementById(`${endpoint}-latency`).textContent = `${value}ms`;
            await fetch(`/api/config/${endpoint}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(config) });
        }

        async function handleApproval(approvalId, approved) {
            await fetch(`/api/approve/${approvalId}?approved=${approved}`, { method: 'POST' });
        }

        async function handleSpecialtyApproval(specialtyAuthId, approved) {
            await fetch(`/api/specialty-approve/${specialtyAuthId}?approved=${approved}`, { method: 'POST' });
        }

        function clearLogs() { document.getElementById('logsContainer').innerHTML = ''; }

        async function generateLoad() {
            await fetch('/api/admin/generate-load', { method: 'POST' });
            if (autoProcessMode) {
                setTimeout(async () => {
                    const pending = Object.values(prescriptions).filter(p => p.status === 'Pending');
                    for (const p of pending) {
                        await processWorkflow(p.id, p.isHighRisk);
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }
                }, 1000);
            }
        }

        function showConfirm(message, onConfirm) {
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmYes').onclick = () => { closeConfirmModal(); onConfirm(); };
            document.getElementById('confirmModal').classList.add('show');
        }

        function closeConfirmModal() { document.getElementById('confirmModal').classList.remove('show'); }

        async function resetEverything() {
            showConfirm('This will reset all data and configurations. Continue?', async () => {
                autoProcessMode = false;
                updateConnectionStatus();
                prescriptions = {};
                approvals = {};
                specialtyApprovals = {};
                Object.keys(endpointConfigs).forEach(key => {
                    endpointConfigs[key] = { failureRatePercent: 0, latencyMs: 0, completeOutage: false };
                });
                for (const endpoint of Object.keys(endpointConfigs)) {
                    await fetch(`/api/config/${endpoint}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(endpointConfigs[endpoint]) });
                }
                await fetch('/api/admin/reset', { method: 'POST' });
                clearLogs();
                await loadPrescriptions();
                await loadApprovals();
                await loadSpecialtyApprovals();
                renderConfigs();
            });
        }

        function openNewRequestModal() {
            const firstNames = ["James", "Mary", "John", "Patricia", "Robert", "Jennifer", "Michael", "Linda", "William", "Barbara",
                                "David", "Elizabeth", "Richard", "Susan", "Joseph", "Jessica", "Thomas", "Sarah", "Charles", "Karen"];
            const lastNames  = ["Smith", "Johnson", "Williams", "Brown", "Jones", "Garcia", "Miller", "Davis", "Rodriguez", "Martinez",
                                "Hernandez", "Lopez", "Gonzalez", "Wilson", "Anderson", "Thomas", "Taylor", "Moore", "Jackson", "Martin"];

            document.getElementById('patientName').value =
                `${firstNames[Math.floor(Math.random() * firstNames.length)]} ${lastNames[Math.floor(Math.random() * lastNames.length)]}`;
            document.getElementById('recipientName').value =
                `${firstNames[Math.floor(Math.random() * firstNames.length)]} ${lastNames[Math.floor(Math.random() * lastNames.length)]}`;
            document.getElementById('amount').value = (Math.floor(Math.random() * 14900) + 100).toFixed(2);
            document.getElementById('medication').selectedIndex =
                Math.floor(Math.random() * document.getElementById('medication').options.length);
            document.getElementById('refills').value = Math.floor(Math.random() * 13);
            document.getElementById('isHighRisk').checked = false;

            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('eligibleDate').value = now.toISOString().slice(0, 16);

            pendingImageBase64 = null;
            document.getElementById('imageAttachment').value = '';
            document.getElementById('fileUploadLabel').classList.remove('file-selected');
            document.getElementById('fileUploadArea').classList.remove('has-file');
            document.getElementById('fileUploadText').textContent = 'Click to attach document (optional)';
            document.getElementById('fileSizeWarning').classList.remove('show');

            document.getElementById('newRequestModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('newRequestModal').classList.remove('show');
        }

        async function submitNewRequest() {
            const patientName   = document.getElementById('patientName').value;
            const recipientName = document.getElementById('recipientName').value;
            const amount        = parseFloat(document.getElementById('amount').value);
            const medication    = document.getElementById('medication').value;
            const eligibleDate  = document.getElementById('eligibleDate').value;
            const refills       = parseInt(document.getElementById('refills').value);
            const isHighRisk     = document.getElementById('isHighRisk').checked;

            if (!patientName) { alert('Please enter a customer name'); return; }
            if (!recipientName) { alert('Please enter a recipient name'); return; }
            if (!amount || amount <= 0) { alert('Please enter a valid amount'); return; }

            const prescription = {
                id:               'P' + Date.now(),
                patientId:        'PAT' + Math.random().toString(36).substr(2, 9),
                patientName, recipientName, amount, medication,
                eligibleDate:     new Date(eligibleDate).toISOString(),
                refillsRemaining: refills,
                isHighRisk,
                status:           'Pending',
                requestedDate:    new Date().toISOString()
            };

            await fetch('/api/prescriptions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(prescription) });
            prescriptions[prescription.id] = prescription;
            renderPrescriptions();
            closeModal();

            if (pendingImageBase64) {
                await processWorkflowWithImage(prescription.id, pendingImageBase64, isHighRisk);
                pendingImageBase64 = null;
            } else {
                await processWorkflow(prescription.id, isHighRisk);
            }
        }

        async function processWorkflow(prescriptionId, isHighRisk = false) {
            activeWorkflows++;
            updateConnectionStatus();
            try {
                const response = await fetch(`/api/workflow/start/${prescriptionId}?isHighRisk=${isHighRisk}`, { method: 'POST' });
                if (!response.ok) throw new Error('Failed to start workflow');
                const result = await response.json();
                console.log('Temporal workflow started:', result.workflowId);
            } catch (error) {
                console.error('Failed to start workflow:', error);
                renderPrescriptions();
            } finally {
                activeWorkflows--;
                updateConnectionStatus();
            }
        }

        async function processWorkflowWithImage(prescriptionId, imageBase64, isHighRisk = false) {
            activeWorkflows++;
            updateConnectionStatus();
            try {
                const response = await fetch(`/api/workflow/start-with-image/${prescriptionId}?isHighRisk=${isHighRisk}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imageData: imageBase64 })
                });
                if (!response.ok) throw new Error('Failed to start workflow with image');
                const result = await response.json();
                console.log('Temporal workflow (with image) started:', result.workflowId);
            } catch (error) {
                console.error('Failed to start workflow with image:', error);
                renderPrescriptions();
            } finally {
                activeWorkflows--;
                updateConnectionStatus();
            }
        }

        startConnection();
    </script>
</body>
</html>
